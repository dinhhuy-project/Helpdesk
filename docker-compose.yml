name: ${COMPOSE_PROJECT_NAME:-helpdesk}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    # Cache only: persistence is deliberately disabled.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./deploy/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_ENABLED: ${MINIO_ENABLED:-false}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # --wait succeeds only after attachment bootstrap completes, including after a volume reset.
      test: ["CMD-SHELL", "test -f /tmp/helpdesk-minio-ready && curl --fail --silent http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio-init:
    profiles: ["storage-setup"]
    build:
      context: ./deploy/minio-client
    restart: "no"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ENABLED: ${MINIO_ENABLED:-false}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-}
    volumes:
      - ./deploy/minio/initialize.sh:/setup/initialize.sh:ro
      - ./deploy/minio/attachments-policy.json:/setup/attachments-policy.json:ro
      - ./deploy/minio/verify.sh:/setup/verify.sh:ro
    entrypoint: ["/bin/sh", "/setup/initialize.sh"]
    depends_on:
      minio:
        condition: service_healthy

  api:
    profiles: ["backend"]
    build:
      context: ./be
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Jwt__Issuer: ${JWT_ISSUER:-Helpdesk.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Helpdesk.Web}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      # Redis integration is deferred; attachment storage is explicitly enabled after setup.
      ConnectionStrings__Helpdesk: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-helpdesk};Username=${POSTGRES_USER:-helpdesk};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Redis__Configuration: "redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      Minio__Endpoint: "minio:9000"
      Minio__Enabled: ${MINIO_ENABLED:-false}
      Minio__AccessKey: ${MINIO_APP_ACCESS_KEY:-}
      Minio__SecretKey: ${MINIO_APP_SECRET_KEY:-}
      Minio__Bucket: helpdesk-attachments
      Minio__UseSsl: "false"
      KnowledgeSources__WikipediaEnabled: ${KNOWLEDGE_WIKIPEDIA_ENABLED:-true}
      KnowledgeSources__BookStack__Enabled: ${BOOKSTACK_CONNECTOR_ENABLED:-false}
      KnowledgeSources__BookStack__SourceId: ${BOOKSTACK_SOURCE_ID:-support-wiki}
      KnowledgeSources__BookStack__BaseUrl: ${BOOKSTACK_BASE_URL:-http://host.docker.internal:6875/}
      KnowledgeSources__BookStack__AllowHttp: "true"
      KnowledgeSources__BookStack__BookId: ${BOOKSTACK_BOOK_ID:-0}
      KnowledgeSources__BookStack__TokenId: ${BOOKSTACK_TOKEN_ID:-}
      KnowledgeSources__BookStack__TokenSecret: ${BOOKSTACK_TOKEN_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
