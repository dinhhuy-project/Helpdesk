# Optional local-only AI stack, independent of database/storage. Explicit project name avoids .env's COMPOSE_PROJECT_NAME.
# docker compose -p helpdesk-ai -f docker-compose.ai.yml up -d --wait ollama
name: helpdesk-ai

services:
  ollama:
    # Ollama 0.40.13, pinned multi-architecture image.
    image: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 6g
    cpus: 4

volumes:
  ollama-models:
